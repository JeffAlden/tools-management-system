name: Build and MySQL workflow verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: altech_tms_test
          MYSQL_USER: tms_test
          # Disposable CI credentials, unrelated to deployment or application accounts.
          MYSQL_PASSWORD: ci-only-${{ github.run_id }}-${{ github.run_attempt }}
          MYSQL_ROOT_PASSWORD: ci-root-only-${{ github.run_id }}-${{ github.run_attempt }}
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      NODE_ENV: test
      APP_ORIGIN: http://localhost:5173
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_DATABASE: altech_tms_test
      MYSQL_USER: tms_test
      MYSQL_PASSWORD: ci-only-${{ github.run_id }}-${{ github.run_attempt }}
      UPLOAD_DIR: ./test-uploads
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run db:migrate
      - run: npm run test:integration
      - run: npm audit --omit=dev
      - run: docker build -f deployment/Dockerfile.api -t tms-api-test .
      - run: docker build -f deployment/Dockerfile.web -t tms-web-test .
